<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Info banner: transient messages (e.g. storage load failure) -->
  <div id="info-banner" role="status" aria-live="polite" hidden></div>

  <!-- Error banner: persistent messages (e.g. save failure) -->
  <div id="error-banner" role="alert" aria-live="assertive" hidden>
    <span id="error-banner-msg"></span>
    <button id="error-banner-close" aria-label="Dismiss error">✕</button>
  </div>

  <header>
    <h1>Expense &amp; Budget Visualizer</h1>
    <div class="balance-wrapper">
      <span class="balance-label">Total Spent</span>
      <div id="balance-display" aria-live="polite" aria-label="Total balance">0.00</div>
    </div>
  </header>

  <main>

    <!-- Input Form Section -->
    <section class="form-section" aria-labelledby="form-heading">
      <h2 id="form-heading">Add Expense</h2>
      <form id="expense-form" novalidate>

        <div class="field-group">
          <label for="expense-name">Item Name</label>
          <input
            type="text"
            id="expense-name"
            name="expense-name"
            maxlength="100"
            placeholder="e.g. Lunch"
            autocomplete="off"
          />
          <span class="error-msg" id="error-name" aria-live="polite"></span>
        </div>

        <div class="field-group">
          <label for="expense-amount">Amount ($)</label>
          <input
            type="number"
            id="expense-amount"
            name="expense-amount"
            min="0.01"
            max="999999999.99"
            step="0.01"
            placeholder="0.00"
          />
          <span class="error-msg" id="error-amount" aria-live="polite"></span>
        </div>

        <div class="field-group">
          <label for="expense-category">Category</label>
          <select id="expense-category" name="expense-category">
            <option value="" disabled selected>Select a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Fun">Fun</option>
          </select>
          <span class="error-msg" id="error-category" aria-live="polite"></span>
        </div>

        <button type="submit" id="submit-btn">Add Transaction</button>

      </form>
    </section>

    <!-- Transaction List Section -->
    <section class="list-section" aria-labelledby="list-heading">
      <h2 id="list-heading">Transactions</h2>
      <ul id="transaction-list" aria-label="Transaction list">
        <!-- Transactions rendered here by JS -->
      </ul>
    </section>

    <!-- Chart Section -->
    <section class="chart-section" aria-labelledby="chart-heading">
      <h2 id="chart-heading">Spending by Category</h2>
      <div id="chart-placeholder" class="chart-placeholder">
        <p>No data to visualize yet.</p>
      </div>
      <canvas id="expense-chart" aria-label="Pie chart of spending by category" role="img" hidden></canvas>
    </section>

  </main>

  <!-- Chart.js from CDN — must come before app.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Application logic -->
  <script src="js/app.js"></script>

</body>
</html>
